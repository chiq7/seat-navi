name: Official News Crawler

# 公式NEWS取得(毎日7分割)。実行本体は scripts/crawlOfficialNews.mts。
# レジストリでenabled=trueの公式NEWSを、安定ハッシュで毎日約1/7ずつ取得する。
# 旧13組の専用parserは scripts/officialNews/legacySites.ts (Tier3/special) に維持する。
#
# スケジュール: UTC毎日19:00 = JST毎日4:00(深夜帯)。
# 手動実行(workflow_dispatch)では artist_slug / dry_run / group を指定できる。
#
# 1サイト/1記事の失敗後も残りを処理し、レポートを保存してからジョブを失敗させる。

on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:
    inputs:
      artist_slug:
        description: "特定アーティストのみ実行する場合のslug(例: exo)。空なら全対象サイトを実行。"
        required: false
        type: string
      dry_run:
        description: "trueならSupabaseへ接続しない。Geminiも別入力で明示しない限り呼び出さない。"
        required: false
        type: boolean
        default: true
      classify_with_gemini:
        description: "Gemini API分類を有効化する。dry-runとは独立し、API利用量が発生します。"
        required: false
        type: boolean
        default: false
      group:
        description: "特定グループのみ実行する場合の名前(specialParserNameまたはcmsGroup)。空なら全対象。"
        required: false
        type: string

permissions:
  contents: write
  issues: write

# 二重実行防止: 同じgroupの実行中ジョブがあれば、新しい実行は待機させる(キャンセルはしない)。
concurrency:
  group: official-news-crawler
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    # exo-jp.netのCrawl-delay(30秒)等、待機を含むため余裕を持たせる。
    timeout-minutes: 90
    env:
      INPUT_ARTIST_SLUG: ${{ inputs.artist_slug }}
      INPUT_GROUP: ${{ inputs.group }}
      INPUT_DRY_RUN: ${{ inputs.dry_run }}
      INPUT_CLASSIFY_WITH_GEMINI: ${{ inputs.classify_with_gemini }}
      WORKFLOW_EVENT_NAME: ${{ github.event_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate workflow inputs
        shell: bash
        run: |
          allowed='^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$'
          if [[ -n "$INPUT_ARTIST_SLUG" && ! "$INPUT_ARTIST_SLUG" =~ $allowed ]]; then
            echo "Invalid artist_slug. Allowed: ASCII letters, digits, underscore, hyphen (1-64 chars)." >&2
            exit 2
          fi
          if [[ -n "$INPUT_GROUP" && ! "$INPUT_GROUP" =~ $allowed ]]; then
            echo "Invalid group. Allowed: ASCII letters, digits, underscore, hyphen (1-64 chars)." >&2
            exit 2
          fi

      - name: Typecheck crawler
        run: npm run typecheck:crawler

      - name: Run official news crawler
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OFFICIAL_NEWS_ALLOW_PRODUCTION_WRITE: ${{ vars.OFFICIAL_NEWS_ALLOW_PRODUCTION_WRITE }}
        run: |
          ARGS=()
          if [[ "$WORKFLOW_EVENT_NAME" == "schedule" ]]; then
            # Scheduled ingestion is intentionally live and explicit. Artists are split into seven
            # stable daily shards. The CLI still requires the repository variable as a second confirmation.
            SHARD_INDEX=$(( $(TZ=Asia/Tokyo date +%u) - 1 ))
            ARGS+=(--execute --classify "--shard=${SHARD_INDEX}/7")
          else
            if [[ "$INPUT_DRY_RUN" == "true" ]]; then
              ARGS+=(--dry-run)
            else
              ARGS+=(--execute)
            fi
            if [[ "$INPUT_CLASSIFY_WITH_GEMINI" == "true" ]]; then
              ARGS+=(--classify)
            fi
          fi
          if [[ -n "$INPUT_ARTIST_SLUG" ]]; then ARGS+=("--artist=$INPUT_ARTIST_SLUG"); fi
          if [[ -n "$INPUT_GROUP" ]]; then ARGS+=("--group=$INPUT_GROUP"); fi
          node --experimental-strip-types --import ./scripts/ts-loader.mjs ./scripts/crawlOfficialNews.mts "${ARGS[@]}"
          if [[ "$WORKFLOW_EVENT_NAME" == "schedule" || ("$INPUT_DRY_RUN" != "true" && "$INPUT_CLASSIFY_WITH_GEMINI" == "true") ]]; then
            node --experimental-strip-types --import ./scripts/ts-loader.mjs ./scripts/syncOfficialNewsEvents.mts --execute
          fi

      - name: Report Gemini free-tier stop
        if: failure() && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! -d official-news-reports ]]; then exit 0; fi
          report=$(find official-news-reports -name 'crawl-report-*.json' -type f -print -quit)
          if [[ -n "$report" ]] && jq -e '.quota_stopped == true' "$report" > /dev/null; then
            {
              echo '## Gemini無料枠・レート上限で停止'
              echo ''
              echo '追加のAI分類と公演同期は実行していません。レポートartifactを確認してください。'
            } >> "$GITHUB_STEP_SUMMARY"
            title='[要対応] Gemini無料枠・レート上限で公式NEWS巡回を停止'
            existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq 'length > 0')
            if [[ "$existing" != 'true' ]]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body 'Geminiの無料枠またはレート上限を検知したため、以後のAI分類と公演同期を停止しました。実行レポートartifactを確認し、上限が戻った後に手動再実行してください。'
            fi
            node --experimental-strip-types ./scripts/updateOfficialNewsStatus.mts \
              --status=stopped \
              --only-if-current=normal \
              --run-url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              --message='Gemini無料枠・レート上限で停止中。GitHubの要対応Issueを確認してください。'
            if ! git diff --quiet -- public/automation/official-news-status.csv; then
              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git add -- public/automation/official-news-status.csv
              git commit -m 'chore: flag official news quota stop'
              git push origin HEAD:main
            fi
          fi

      - name: Clear Gemini stop status after a successful live run
        if: success() && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (inputs.dry_run == false && inputs.classify_with_gemini == true))
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --experimental-strip-types ./scripts/updateOfficialNewsStatus.mts \
            --status=normal \
            --only-if-current=stopped \
            --run-url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --message='自動巡回は正常です。'
          if ! git diff --quiet -- public/automation/official-news-status.csv; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- public/automation/official-news-status.csv
            git commit -m 'chore: clear official news quota status'
            git push origin HEAD:main
          fi
          title='[要対応] Gemini無料枠・レート上限で公式NEWS巡回を停止'
          issue_number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [[ -n "$issue_number" ]]; then
            gh issue close "$issue_number" --repo "$GITHUB_REPOSITORY" --comment 'Gemini分類を含む巡回が正常完了したため、停止状態を解除しました。'
          fi

      - name: Ensure artifact fallback report exists
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          mkdir -p official-news-reports
          if ! find official-news-reports -type f -print -quit | grep -q .; then
            printf 'status=%s\nrun_id=%s\nrun_attempt=%s\nnote=%s\n' \
              "$JOB_STATUS" "$RUN_ID" "$RUN_ATTEMPT" \
              "Crawler report was not created; an earlier workflow step failed or was cancelled." \
              > official-news-reports/workflow-fallback.txt
          fi

      - name: Upload crawl report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-news-report-${{ github.run_id }}
          path: official-news-reports/
          retention-days: 90
          if-no-files-found: error
